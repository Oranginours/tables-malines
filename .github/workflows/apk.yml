name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le projet
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done
          F=$(find . -name settings.gradle | head -1)
          if [ -z "$F" ]; then echo "::error::Projet introuvable : envoie TablesMalines.zip dans le dépôt"; exit 1; fi
          echo "DIR=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.3"}
      - run: cd "$DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TablesMalines-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
